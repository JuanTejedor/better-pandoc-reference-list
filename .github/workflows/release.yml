name: Release

# Push a tag equal to the version in manifest.json (e.g. 3.0.1, no "v") to publish a release.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check-types
      - run: npm run build
      - name: Tag must match manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version $version" >&2
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" --generate-notes
